name: FocusDock
options:
  bundleIdPrefix: com.theportlandcompany
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Release-AppStore: release
targets:
  FocusDock:
    type: application
    platform: macOS
    sources:
      - path: Sources/iOSDock
    info:
      path: Sources/iOSDock/Info.plist
      properties:
        CFBundleName: Focus Dock
        CFBundleDisplayName: "Focus: Dock"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "16"
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        LSUIElement: true
        NSAppleEventsUsageDescription: "Focus: Dock asks Finder how many items are in the Trash so the dock icon can show empty or full."
        NSAccessibilityUsageDescription: "Focus: Dock uses Accessibility to read live app badges and minimized window state from the system Dock so it can display them in your custom dock, and to switch between desktops when you click a desktop thumbnail."
        NSMainStoryboardFile: ""
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theportlandcompany.FocusDock
        PRODUCT_NAME: "Focus Dock"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        DEVELOPMENT_TEAM: VP38993WK6
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        Debug:
          # Stable dev identity so TCC (Accessibility) grants survive rebuilds.
          # Matches the cert the live dock binary is signed with — the old
          # self-signed "Focus Dock Developer" cert no longer exists locally.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          # Custom configs can drop Xcode's defaults — keep DEBUG explicit.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        # Direct-download (DMG / Developer ID) build: NOT sandboxed, full
        # private-API feature set.
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Sources/iOSDock/FocusDock-DMG.entitlements
        # Mac App Store build: sandboxed, private APIs compiled out.
        Release-AppStore:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Sources/iOSDock/FocusDock.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
schemes:
  FocusDock:
    build:
      targets:
        FocusDock: all
    run:
      config: Debug
    archive:
      config: Release
  FocusDock-AppStore:
    build:
      targets:
        FocusDock: all
    run:
      config: Release-AppStore
    archive:
      config: Release-AppStore
